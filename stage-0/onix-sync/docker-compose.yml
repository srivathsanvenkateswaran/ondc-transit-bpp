name: onix-sync-spike

services:
  sync-mongo:
    image: mongo:4.4
    platform: linux/amd64
    environment:
      MONGO_INITDB_ROOT_USERNAME: beckn
      MONGO_INITDB_ROOT_PASSWORD: beckn123
    networks: [beckn]
    volumes:
      - sync_mongo_data:/data/db

  sync-rabbitmq:
    # The installer's 3.8/amd64 image segfaults under Apple Silicon emulation.
    # AMQP 0-9-1 is unchanged; a native multi-arch release avoids that host issue.
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: beckn
      RABBITMQ_DEFAULT_PASS: beckn123
    networks: [beckn]

  sync-redis:
    image: redis:6.2.5-alpine
    networks: [beckn]

  bap-client:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/core_1.1.0.yaml schemas/core_2.0.1.yaml && cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-mongo, sync-rabbitmq, sync-redis]
    ports: ["${BAP_CLIENT_PORT:-5001}:${BAP_CLIENT_PORT:-5001}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bap-client.yml:/usr/src/app/config/default.yml:ro

  bap-network:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/core_1.1.0.yaml schemas/core_2.0.1.yaml && cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-mongo, sync-rabbitmq, sync-redis]
    ports: ["${BAP_NETWORK_PORT:-5002}:${BAP_NETWORK_PORT:-5002}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bap-network.yml:/usr/src/app/config/default.yml:ro

  bmtc-bpp-client:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/core_1.1.0.yaml schemas/core_2.0.1.yaml && cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${BMTC_BPP_CLIENT_PORT:-6001}:${BMTC_BPP_CLIENT_PORT:-6001}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmtc-bpp-client.yml:/usr/src/app/config/default.yml:ro

  bmtc-bpp-network:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/core_1.1.0.yaml schemas/core_2.0.1.yaml && cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${BMTC_BPP_NETWORK_PORT:-6002}:${BMTC_BPP_NETWORK_PORT:-6002}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmtc-bpp-network.yml:/usr/src/app/config/default.yml:ro

  bmrcl-bpp-client:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/core_1.1.0.yaml schemas/core_2.0.1.yaml && cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${BMRCL_BPP_CLIENT_PORT:-6101}:${BMRCL_BPP_CLIENT_PORT:-6101}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmrcl-bpp-client.yml:/usr/src/app/config/default.yml:ro

  bmrcl-bpp-network:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/core_1.1.0.yaml schemas/core_2.0.1.yaml && cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${BMRCL_BPP_NETWORK_PORT:-6102}:${BMRCL_BPP_NETWORK_PORT:-6102}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmrcl-bpp-network.yml:/usr/src/app/config/default.yml:ro

  transit-bpp:
    build:
      context: ../..
    image: ondc-transit-bpp:local
    environment:
      PROVIDER_HOST: ${PROVIDER_HOST:-0.0.0.0}
      PROVIDER_PORT: ${PROVIDER_PORT:-7001}
      PROVIDER_PUBLIC_BASE_URL: ${PROVIDER_PUBLIC_BASE_URL:-http://transit-bpp:7001}
      JOURNEY_SOURCE: ${JOURNEY_SOURCE:-fixture}
      FIXTURE_ROOT: ${FIXTURE_ROOT:-/app/fixtures}
      TRV11_SCHEMA_ROOT: ${TRV11_SCHEMA_ROOT:-/app/schemas/ondc_trv11/2.0.1}
      CALLBACK_TIMEOUT_MS: ${CALLBACK_TIMEOUT_MS:-3000}
      CONTEXT_TTL: ${CONTEXT_TTL:-PT30S}
      BMTC_BPP_ID: ${BMTC_BPP_ID:-bmtc.bpp.transit.localhost}
      BMTC_BPP_URI: ${BMTC_BPP_URI:-http://bmtc-bpp-network:6002}
      BMTC_CALLBACK_URL: ${BMTC_CALLBACK_URL:-http://bmtc-bpp-client:6001/on_search}
      BMTC_CALLBACK_DELAY_MS: ${BMTC_CALLBACK_DELAY_MS:-0}
      BMRCL_BPP_ID: ${BMRCL_BPP_ID:-bmrcl.bpp.transit.localhost}
      BMRCL_BPP_URI: ${BMRCL_BPP_URI:-http://bmrcl-bpp-network:6102}
      BMRCL_CALLBACK_URL: ${BMRCL_CALLBACK_URL:-http://bmrcl-bpp-client:6101/on_search}
      BMRCL_CALLBACK_DELAY_MS: ${BMRCL_CALLBACK_DELAY_MS:-0}
    ports: ["${PROVIDER_PORT:-7001}:${PROVIDER_PORT:-7001}"]
    networks: [beckn]

networks:
  beckn:
    external: true
    name: beckn_network

volumes:
  sync_mongo_data:
