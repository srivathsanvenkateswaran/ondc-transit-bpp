name: onix-sync-spike

services:
  sync-mongo:
    image: mongo:4.4
    platform: linux/amd64
    environment:
      MONGO_INITDB_ROOT_USERNAME: beckn
      MONGO_INITDB_ROOT_PASSWORD: beckn123
    networks: [beckn]
    volumes:
      - sync_mongo_data:/data/db

  sync-rabbitmq:
    # The installer's 3.8/amd64 image segfaults under Apple Silicon emulation.
    # AMQP 0-9-1 is unchanged; a native multi-arch release avoids that host issue.
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: beckn
      RABBITMQ_DEFAULT_PASS: beckn123
    networks: [beckn]

  sync-redis:
    image: redis:6.2.5-alpine
    networks: [beckn]

  bap-client:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-mongo, sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${BAP_CLIENT_PORT:-5001}:${BAP_CLIENT_PORT:-5001}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bap-client.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_2.0.1.yaml:/usr/src/app/schemas/core_2.0.1.yaml:ro

  bap-network:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-mongo, sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${BAP_NETWORK_PORT:-5002}:${BAP_NETWORK_PORT:-5002}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bap-network.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_2.0.1.yaml:/usr/src/app/schemas/core_2.0.1.yaml:ro

  bmtc-bpp-client:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${BMTC_BPP_CLIENT_PORT:-6001}:${BMTC_BPP_CLIENT_PORT:-6001}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmtc-bpp-client.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_2.0.1.yaml:/usr/src/app/schemas/core_2.0.1.yaml:ro

  bmtc-bpp-network:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${BMTC_BPP_NETWORK_PORT:-6002}:${BMTC_BPP_NETWORK_PORT:-6002}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmtc-bpp-network.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_2.0.1.yaml:/usr/src/app/schemas/core_2.0.1.yaml:ro

  bmrcl-bpp-client:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${BMRCL_BPP_CLIENT_PORT:-6101}:${BMRCL_BPP_CLIENT_PORT:-6101}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmrcl-bpp-client.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_2.0.1.yaml:/usr/src/app/schemas/core_2.0.1.yaml:ro

  bmrcl-bpp-network:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_2.0.1.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${BMRCL_BPP_NETWORK_PORT:-6102}:${BMRCL_BPP_NETWORK_PORT:-6102}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/bmrcl-bpp-network.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_2.0.1.yaml:/usr/src/app/schemas/core_2.0.1.yaml:ro

  # The reserved intercity seller. A third BPP rather than a third category on
  # an existing one, because it publishes a different domain string:
  # TRANSIT.LOCALHOST:INTERCITY at version 0.1.0. A subscriber is registered
  # against one domain, and the gateway routes a search by the domain in its
  # context, so a second domain needs a second subscription and therefore a
  # second pair of protocol servers.
  #
  # The command copies the context schema under this version's name and the
  # core schema is mounted under its own, because the protocol server resolves
  # both by the version in the request context. The copy is the same
  # workaround the two sellers above already use for 2.0.1.
  ksrtc-bpp-client:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_0.1.0.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${KSRTC_BPP_CLIENT_PORT:-6201}:${KSRTC_BPP_CLIENT_PORT:-6201}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/ksrtc-bpp-client.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_0.1.0.yaml:/usr/src/app/schemas/core_0.1.0.yaml:ro

  ksrtc-bpp-network:
    image: fidedocker/protocol-server@sha256:4f15b3a82c32a0a9b7aac79cc692a029b85d8b845f2b0b6c10fbefd0327b8e23
    platform: linux/amd64
    command: ["/bin/sh", "-c", "cp schemas/context_1.1.0.json schemas/context_0.1.0.json && exec node dist/app.js"]
    depends_on: [sync-rabbitmq, sync-redis]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${KSRTC_BPP_NETWORK_PORT:-6202}:${KSRTC_BPP_NETWORK_PORT:-6202}"]
    networks: [beckn]
    volumes:
      - ./runtime/config/ksrtc-bpp-network.yml:/usr/src/app/config/default.yml:ro
      - ./schemas/core_0.1.0.yaml:/usr/src/app/schemas/core_0.1.0.yaml:ro

  transit-bpp:
    build:
      context: ../..
    image: ondc-transit-bpp:local
    environment:
      PROVIDER_HOST: ${PROVIDER_HOST:-0.0.0.0}
      PROVIDER_PORT: ${PROVIDER_PORT:-7001}
      PROVIDER_PUBLIC_BASE_URL: ${PROVIDER_PUBLIC_BASE_URL:-http://transit-bpp:7001}
      JOURNEY_SOURCE: ${JOURNEY_SOURCE:-fixture}
      JOURNEY_SOURCE_URL: ${JOURNEY_SOURCE_URL:-}
      JOURNEY_SOURCE_RESPONSE_SCHEMA: ${JOURNEY_SOURCE_RESPONSE_SCHEMA:-/app/schemas/journey-source-response.json}
      FIXTURE_ROOT: ${FIXTURE_ROOT:-/app/fixtures}
      TRV11_SCHEMA_ROOT: ${TRV11_SCHEMA_ROOT:-/app/schemas/ondc_trv11/2.0.1}
      CALLBACK_TIMEOUT_MS: ${CALLBACK_TIMEOUT_MS:-3000}
      CONTEXT_TTL: ${CONTEXT_TTL:-PT30S}
      ORDER_INSPECTION_TOKEN: ${ORDER_INSPECTION_TOKEN:-}
      BMTC_BPP_ID: ${BMTC_BPP_ID:-bmtc.bpp.transit.localhost}
      BMTC_BPP_URI: ${BMTC_BPP_URI:-http://bmtc-bpp-network:6002}
      BMTC_CALLBACK_URL: ${BMTC_CALLBACK_URL:-http://bmtc-bpp-client:6001/on_search}
      BMTC_CALLBACK_DELAY_MS: ${BMTC_CALLBACK_DELAY_MS:-0}
      BMRCL_BPP_ID: ${BMRCL_BPP_ID:-bmrcl.bpp.transit.localhost}
      BMRCL_BPP_URI: ${BMRCL_BPP_URI:-http://bmrcl-bpp-network:6102}
      BMRCL_CALLBACK_URL: ${BMRCL_CALLBACK_URL:-http://bmrcl-bpp-client:6101/on_search}
      BMRCL_CALLBACK_DELAY_MS: ${BMRCL_CALLBACK_DELAY_MS:-0}
      # Off unless the deployment has also created the second network domain
      # in the registry and subscribed this seller under it. See
      # deploy/seed-registry.sh.
      RESERVED_ENABLED: ${RESERVED_ENABLED:-false}
      RESERVED_SCHEMA_ROOT: ${RESERVED_SCHEMA_ROOT:-/app/schemas/transit_local_intercity/0.1.0}
      KSRTC_BPP_ID: ${KSRTC_BPP_ID:-ksrtc.bpp.transit.localhost}
      KSRTC_BPP_URI: ${KSRTC_BPP_URI:-http://ksrtc-bpp-network:6202}
      KSRTC_CALLBACK_URL: ${KSRTC_CALLBACK_URL:-http://ksrtc-bpp-client:6201/on_search}
      KSRTC_CALLBACK_DELAY_MS: ${KSRTC_CALLBACK_DELAY_MS:-0}
      RESERVATION_CLOSE_MINUTES: ${RESERVATION_CLOSE_MINUTES:-45}
      RESERVATION_HORIZON_DAYS: ${RESERVATION_HORIZON_DAYS:-30}
      RESERVATION_HOLD_TTL_SECONDS: ${RESERVATION_HOLD_TTL_SECONDS:-600}
      SEAT_OCCUPANCY_SEED: ${SEAT_OCCUPANCY_SEED:-20260905}
      RESERVED_SOURCE: ${RESERVED_SOURCE:-fixture}
      RESERVED_SOURCE_URL: ${RESERVED_SOURCE_URL:-}
      RESERVED_DB_URL: ${RESERVED_DB_URL:-file:/app/data/reserved.db}
      RESERVED_MIGRATION_ROOT: ${RESERVED_MIGRATION_ROOT:-/app/migrations/reserved}
      RESERVED_MANIFEST_RETENTION_DAYS: ${RESERVED_MANIFEST_RETENTION_DAYS:-30}
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${PROVIDER_PORT:-7001}:${PROVIDER_PORT:-7001}"]
    # Held and booked seats are the one thing this provider keeps that a
    # restart must not lose. Without this volume a compose down releases every
    # hold and orphans every booking, which is the failure the database exists
    # to prevent.
    volumes:
      - reserved_data:/app/data
    networks: [beckn]

networks:
  beckn:
    external: true
    name: beckn_network

volumes:
  sync_mongo_data:
  reserved_data:
